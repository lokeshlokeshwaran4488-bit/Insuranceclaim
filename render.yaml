services:
  # ─── FastAPI Backend Web Service ───────────────────────────────────────────
  - type: web
    name: insureclaim-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: InsureClaim AI
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: DATABASE_URL
        fromDatabase:
          name: insureclaim-postgres
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: insurance_claims_docs
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: ALLOWED_EXTENSIONS
        value: pdf,jpg,jpeg,png
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: PROMETHEUS_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "100"

  # ─── React Frontend Static Site ────────────────────────────────────────────
  - type: web
    name: insureclaim-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: insureclaim-backend
          property: host

databases:
  # ─── Managed PostgreSQL ───────────────────────────────────────────────────
  - name: insureclaim-postgres
    plan: free
    region: oregon
    databaseName: insurance_claims
    user: postgres
