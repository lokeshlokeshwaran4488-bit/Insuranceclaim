services:
  mongodb:
    image: mongo:7.0
    container_name: insureclaim-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-insurance_claims}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insureclaim-backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/insurance_claims
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-development_super_secret_jwt_key_change_in_production_12345}
      - NODE_ENV=production
      - UPLOAD_DIR=/app/uploads
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insureclaim-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo_data:
  backend_uploads:
